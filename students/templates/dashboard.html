<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
   
    <a href="{% url 'logout' %}">Logout</a>

    <h3>Create New Student</h3>
    <form method="POST" action="{% url 'create_student' %}">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Name" required><br><br>
        <input type="number" name="age" placeholder="Age" required><br><br>
        <input type="text" name="course" placeholder="Course" required><br><br>
        <button type="submit">Add Student</button>
    </form>
    <ul>
        {% for student in students %}
            <li>
                {{ student.name }} | Age: {{ student.age }} | Course: {{ student.course }}
                <a href="{% url 'update_student' student.id %}">Edit</a>
                <a href="{% url 'delete_student' student.id %}">Delete</a>
            </li>
        {% empty %}
            <li>No students found.</li>
        {% endfor %}
    </ul>
</body>
</html>
